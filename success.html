<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7941D">
<title>e-Mola Crédito | Parabéns · Moçambique</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--or:#F7941D;--or-deep:#D96F00;--or-dark:#A34A00;--or-light:#FFB84D;--amber:#FFC857;--cream:#FFF8F0;--white:#fff;--dark:#1a1a1a;--muted:#6b6b6b;--border:#f0e6da;--ok:#2e7d32;--grad:linear-gradient(135deg,#F7941D 0%,#E8841A 50%,#D96F00 100%);--shadow:0 20px 60px rgba(217,111,0,.35)}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--grad);min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;top:-30%;right:-15%;width:600px;height:600px;background:radial-gradient(circle,rgba(255,255,255,.18) 0%,transparent 70%);border-radius:50%;pointer-events:none}
body::after{content:'';position:fixed;bottom:-25%;left:-10%;width:500px;height:500px;background:radial-gradient(circle,rgba(255,255,255,.1) 0%,transparent 70%);border-radius:50%;pointer-events:none}
header{background:rgba(255,255,255,.96);backdrop-filter:blur(14px);padding:14px 5%;border-bottom:3px solid var(--or-deep);box-shadow:0 2px 12px rgba(0,0,0,.08);position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:14px}
.logo{font-size:24px;font-weight:900;text-decoration:none;letter-spacing:-.8px;display:inline-flex;align-items:center}
.logo .e{color:var(--or-deep)}
.logo .mola{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lang-switch{display:flex;gap:5px}
.lang-btn{background:transparent;border:1.5px solid var(--border);border-radius:50px;padding:6px 12px;font-size:11px;font-weight:800;font-family:inherit;cursor:pointer;color:var(--muted);transition:all .2s}
.lang-btn.active{background:var(--grad);border-color:var(--or);color:#fff;box-shadow:0 4px 10px rgba(217,111,0,.25)}
.lang-btn:hover:not(.active){border-color:var(--or);color:var(--or-deep)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px;position:relative;z-index:1}
.card{background:rgba(255,255,255,.98);backdrop-filter:blur(20px);border-radius:22px;padding:42px 30px;max-width:470px;width:100%;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.5);text-align:center;animation:pop .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:scale(1) translateY(0)}}
.progress{display:flex;justify-content:center;gap:8px;margin-bottom:22px}
.pd{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .3s}
.pd.done{background:var(--or);width:24px;border-radius:5px}
.icon{width:94px;height:94px;background:linear-gradient(135deg,rgba(46,125,50,.12),rgba(46,125,50,.06));border:3px solid var(--ok);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:42px;animation:pop 0.6s cubic-bezier(.34,1.56,.64,1),glow 2.5s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(46,125,50,.35)}50%{box-shadow:0 0 0 18px rgba(46,125,50,0)}}
.card h1{font-size:25px;font-weight:900;color:var(--ok);margin-bottom:8px}
.card .desc{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:28px}
.details{background:var(--grad);border-radius:16px;padding:22px;margin-bottom:26px;color:#fff;text-align:left;box-shadow:0 10px 24px rgba(217,111,0,.25)}
.d-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-bottom:11px}
.d-row:last-child{margin-bottom:0;padding-top:11px;border-top:1px solid rgba(255,255,255,.22);font-weight:900;font-size:14px}
.d-row .lbl{opacity:.85;font-weight:600}
.d-row .val{font-weight:800;text-align:right}
.btn-home{width:100%;background:var(--grad);color:#fff;border:none;padding:16px;border-radius:50px;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;font-family:inherit;box-shadow:0 6px 18px rgba(217,111,0,.35);transition:all .25s;margin-bottom:10px}
.btn-home:hover{transform:translateY(-2px);filter:brightness(1.05);box-shadow:0 10px 24px rgba(217,111,0,.45)}
.btn-receipt{width:100%;background:transparent;color:var(--or-deep);border:2px solid var(--or-deep);padding:16px;border-radius:50px;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;font-family:inherit;transition:all .25s}
.btn-receipt:hover{background:var(--cream)}
.card-ft{margin-top:20px;font-size:11px;color:var(--muted)}
.card-ft a{color:var(--or-deep);text-decoration:none;font-weight:800}
.badges{display:flex;justify-content:center;gap:18px;margin-top:20px;padding-top:20px;border-top:1px solid var(--border);font-size:10.5px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:1000;overflow:hidden}
.c-piece{position:absolute;width:10px;height:10px;border-radius:2px;animation:fall 3.5s ease-out forwards;opacity:0}
@keyframes fall{0%{transform:translateY(-80px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@media (max-width:500px){main{padding:24px 12px}.card{padding:34px 20px}.card h1{font-size:22px}.icon{width:76px;height:76px;font-size:34px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html"><span class="e">e-</span><span class="mola">Mola</span></a>
  <div class="lang-switch">
    <button class="lang-btn active" data-lang="pt" onclick="setLang('pt')">🇲🇿 PT</button>
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">🇬🇧 EN</button>
  </div>
</header>

<main>
  <div class="card">
    <div class="progress"><div class="pd done"></div><div class="pd done"></div><div class="pd done"></div></div>
    <div class="icon">✓</div>
    <h1 data-i18n="sc.h1">Parabéns!</h1>
    <p class="desc" data-i18n="sc.sub">O seu empréstimo foi aprovado com sucesso. O valor será depositado na sua conta e-Mola em poucos minutos.</p>

    <div class="details" id="details">
      <div class="d-row"><span class="lbl" data-i18n="sc.amt">Valor Aprovado</span><span class="val" id="sAmount">&mdash;</span></div>
      <div class="d-row"><span class="lbl" data-i18n="sc.dur">Prazo</span><span class="val" id="sDur">&mdash;</span></div>
      <div class="d-row"><span class="lbl" data-i18n="sc.int">Juros</span><span class="val" id="sInterest">&mdash;</span></div>
      <div class="d-row"><span class="lbl" data-i18n="sc.phone">Telefone</span><span class="val" id="sPhone">&mdash;</span></div>
      <div class="d-row"><span class="lbl" data-i18n="sc.ref">Referência</span><span class="val" id="sRef">&mdash;</span></div>
      <div class="d-row"><span class="lbl" data-i18n="sc.total">Total a Pagar</span><span class="val" id="sTotal">0 MZN</span></div>
    </div>

    <button class="btn-home" onclick="location.href='index.html'" data-i18n="sc.home">Voltar ao Início</button>
    <button class="btn-receipt" onclick="dlReceipt()" data-i18n="sc.receipt">Descarregar Comprovativo</button>

    <div class="card-ft"><span data-i18n="sc.foot1">Transação concluída com sucesso.</span> <a href="index.html" data-i18n="sc.foot2">Solicitar outro empréstimo</a></div>

    <div class="badges">
      <span data-i18n="sc.b1">🔒 Protegido</span>
      <span data-i18n="sc.b2">✓ Verificado</span>
      <span data-i18n="sc.b3">🌐 Seguro</span>
    </div>
  </div>
</main>

<div class="confetti" id="confetti"></div>

<script>
const translations={
  pt:{
    "sc.h1":"Parabéns!","sc.sub":"O seu empréstimo foi aprovado com sucesso. O valor será depositado na sua conta e-Mola em poucos minutos.",
    "sc.amt":"Valor Aprovado","sc.dur":"Prazo","sc.int":"Juros","sc.phone":"Telefone","sc.ref":"Referência","sc.total":"Total a Pagar",
    "sc.home":"Voltar ao Início","sc.receipt":"Descarregar Comprovativo","sc.foot1":"Transação concluída com sucesso.","sc.foot2":"Solicitar outro empréstimo",
    "sc.b1":"🔒 Protegido","sc.b2":"✓ Verificado","sc.b3":"🌐 Seguro"
  },
  en:{
    "sc.h1":"Congratulations!","sc.sub":"Your loan was approved successfully. The amount will be deposited into your e-Mola account within minutes.",
    "sc.amt":"Approved Amount","sc.dur":"Term","sc.int":"Interest","sc.phone":"Phone","sc.ref":"Reference","sc.total":"Total to Pay",
    "sc.home":"Back to Home","sc.receipt":"Download Receipt","sc.foot1":"Transaction completed successfully.","sc.foot2":"Request another loan",
    "sc.b1":"🔒 Protected","sc.b2":"✓ Verified","sc.b3":"🌐 Secure"
  }
};

function applyLanguage(lang){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.getAttribute('data-i18n');
    if(translations[lang]&&translations[lang][k])el.textContent=translations[lang][k];
  });
  localStorage.setItem('emola_lang',lang);
  document.documentElement.lang=lang==='pt'?'pt-MZ':'en';
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
  const dur=bd.duration||'14';
  document.getElementById('sDur').textContent=dur+' '+(lang==='en'?'days':'dias');
}
function setLang(lang){applyLanguage(lang)}

let bd={};
function fmtNum(n){return parseInt(n||0).toLocaleString('pt-PT').replace(/\s/g,'.')}
function calcDueDate(days){const d=new Date();d.setDate(d.getDate()+parseInt(days||14));return d.toLocaleDateString('pt-MZ',{day:'2-digit',month:'long',year:'numeric'})}

function init(){
  const p=new URLSearchParams(location.search);
  const amount=p.get('amount'),dur=p.get('duration'),interest=p.get('interest'),total=p.get('total'),ph=p.get('phone');
  const ref='EML'+Date.now().toString().slice(-8);
  bd={amount:amount||'0',duration:dur||'14',interest:interest||'0',total:total||amount||'0',phone:ph||'N/A',ref};

  document.getElementById('sAmount').textContent=fmtNum(bd.amount)+' MZN';
  document.getElementById('sInterest').textContent=fmtNum(bd.interest)+' MZN';
  document.getElementById('sPhone').textContent=ph?'+258'+ph:'N/A';
  document.getElementById('sRef').textContent=ref;
  document.getElementById('sTotal').textContent=fmtNum(bd.total)+' MZN';
}

function dlReceipt(){
  const lang=localStorage.getItem('emola_lang')||'pt';
  const date=new Date().toLocaleString('pt-MZ');
  const due=calcDueDate(bd.duration);
  let txt;
  if(lang==='en'){
    txt=`========================================
   e-MOLA CREDIT — LOAN RECEIPT
========================================

Reference: ${bd.ref}
Date: ${date}
Status: APPROVED ✓

Approved Amount: ${fmtNum(bd.amount)} MZN
Term: ${bd.duration} days
Interest: ${fmtNum(bd.interest)} MZN
Total to Pay: ${fmtNum(bd.total)} MZN
Due Date: ${due}

Phone: +258${bd.phone}
Method: e-Mola Credit

========================================
  Congratulations! Your loan is approved.
  Thank you for choosing e-Mola Credit.
  My cell, my mola.
========================================`;
  } else {
    txt=`========================================
    COMPROVATIVO DE EMPRÉSTIMO e-Mola
========================================

Referência: ${bd.ref}
Data: ${date}
Estado: APROVADO ✓

Valor Aprovado: ${fmtNum(bd.amount)} MZN
Prazo: ${bd.duration} dias
Juros: ${fmtNum(bd.interest)} MZN
Total a Pagar: ${fmtNum(bd.total)} MZN
Data de Vencimento: ${due}

Telefone: +258${bd.phone}
Método: e-Mola Crédito

========================================
  Parabéns! O seu empréstimo foi aprovado.
  Obrigado por escolher e-Mola Crédito.
  Meu cell, minha mola.
========================================`;
  }

  const blob=new Blob([txt],{type:'text/plain'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`e-Mola_Emprestimo_${bd.ref}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

function confetti(){
  const el=document.getElementById('confetti');
  const colors=['#F7941D','#D96F00','#FFB84D','#FFC857','#A34A00','#FFE9B8','#2e7d32'];
  for(let i=0;i<80;i++){
    const p=document.createElement('div');
    p.className='c-piece';
    p.style.left=Math.random()*100+'%';
    p.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay=Math.random()*2.5+'s';
    p.style.animationDuration=(2.5+Math.random()*2.5)+'s';
    el.appendChild(p);
  }
  setTimeout(()=>el.remove(),5500);
}

window.addEventListener('load',()=>{init();applyLanguage(localStorage.getItem('emola_lang')||'pt');confetti()});
</script>
</body>
</html>
